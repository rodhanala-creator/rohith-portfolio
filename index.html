  <style>
    :root {
      --text-xs:clamp(0.75rem,0.7rem + 0.25vw,0.875rem);
      --text-sm:clamp(0.875rem,0.8rem + 0.35vw,1rem);
      --text-base:clamp(1rem,0.95rem + 0.25vw,1.125rem);
      --text-lg:clamp(1.125rem,1rem + 0.75vw,1.5rem);
      --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --text-2xl:clamp(2rem,1.2rem + 2.5vw,3.5rem);
      --text-3xl:clamp(2.5rem,1rem + 4vw,5rem);
      --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
      --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
      --space-12:3rem;--space-16:4rem;--space-20:5rem;--space-24:6rem;
      --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;
      --radius-xl:1rem;--radius-2xl:1.5rem;--radius-full:9999px;
      --transition-interactive:180ms cubic-bezier(0.16,1,0.3,1);
      --font-display:'Bricolage Grotesque',sans-serif;
      --font-body:'Plus Jakarta Sans',sans-serif;
      --font-mono:'JetBrains Mono',monospace;
      --content-narrow:640px;--content-default:960px;--content-wide:1200px;
    }
    :root,[data-theme="dark"] {
      --color-bg:#08090C;--color-surface:#10121A;--color-surface-2:#161922;
      --color-surface-offset:#1C2030;--color-divider:rgba(255,255,255,.06);
      --color-border:rgba(255,255,255,.08);--color-text:#F0F0F5;
      --color-text-muted:#8A8F9E;--color-text-faint:#4A4F60;
      --color-primary:#4FC3F7;--color-primary-hover:#81D4FA;
      --color-primary-glow:rgba(79,195,247,.15);--color-accent:#7C83FF;
      --color-success:#4ADE80;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.5);
      --shadow-lg:0 12px 40px rgba(0,0,0,.65);
    }
    [data-theme="light"] {
      --color-bg:#F5F6FA;--color-surface:#FFFFFF;--color-surface-2:#F8F9FC;
      --color-surface-offset:#EEF0F6;--color-divider:rgba(0,0,0,.06);
      --color-border:rgba(0,0,0,.09);--color-text:#0F1117;
      --color-text-muted:#5A6070;--color-text-faint:#A0A8BB;
      --color-primary:#0284C7;--color-primary-hover:#0369A1;
      --color-primary-glow:rgba(2,132,199,.12);--color-accent:#5B5FD9;
      --color-success:#16A34A;
      --shadow-sm:0 1px 3px rgba(0,0,0,.07);--shadow-md:0 4px 16px rgba(0,0,0,.09);
      --shadow-lg:0 12px 40px rgba(0,0,0,.12);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
      scroll-behavior:smooth;scroll-padding-top:5rem}
    body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);
      color:var(--color-text);background:var(--color-bg);overflow-x:hidden;
      line-height:1.6;transition:background .35s,color .35s}
    img,picture,video,canvas,svg{display:block;max-width:100%;height:auto}
    input,button,textarea,select{font:inherit;color:inherit}
    h1,h2,h3,h4,h5,h6{text-wrap:balance;line-height:1.15}
    p,li{text-wrap:pretty}
    button{cursor:pointer;background:none;border:none}
    a{color:inherit;text-decoration:none}
    ::selection{background:var(--color-primary-glow);color:var(--color-text)}
    :focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    .container{max-width:var(--content-wide);margin-inline:auto;padding-inline:var(--space-6)}
    .container--narrow{max-width:var(--content-narrow);margin-inline:auto;padding-inline:var(--space-6)}
    .section{padding-block:clamp(var(--space-16),8vw,var(--space-24))}

      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    .glow-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}

    .glow-bg__orb--1{width:60vw;height:60vw;background:var(--color-primary);top:-15%;left:-15%}
    .glow-bg__orb--2{width:50vw;height:50vw;background:var(--color-accent);bottom:10%;right:-15%}

      background:rgba(8,9,12,.72);backdrop-filter:blur(20px) saturate(160%);
      -webkit-backdrop-filter:blur(20px) saturate(160%);

      padding:var(--space-2) var(--space-4);
      box-shadow:0 8px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
      transition:box-shadow .3s}
    [data-theme="light"] .nav{background:rgba(255,255,255,.82)}

    .nav__brand{display:flex;align-items:center;gap:var(--space-3)}

      color:var(--color-text-muted);padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);
      transition:color var(--transition-interactive),background var(--transition-interactive)}
    .nav__link:hover{color:var(--color-text);background:rgba(255,255,255,.05)}
    .nav__cta{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;

    .nav__cta:hover{opacity:.85;transform:translateY(-1px)}
    .nav__right{display:flex;align-items:center;gap:var(--space-2)}
    .theme-toggle{width:36px;height:36px;border-radius:var(--radius-full);display:flex;
      align-items:center;justify-content:center;color:var(--color-text-muted);
      border:1px solid var(--color-border);
      transition:color var(--transition-interactive),background var(--transition-interactive)}
    .theme-toggle:hover{color:var(--color-text);background:rgba(255,255,255,.05)}
    .mobile-toggle{display:none;width:40px;height:40px;border-radius:var(--radius-full);
      align-items:center;justify-content:center;border:1px solid var(--color-border);color:var(--color-text)}
    .mobile-menu{display:none;flex-direction:column;gap:var(--space-2);
      padding-top:var(--space-3);border-top:1px solid var(--color-divider);margin-top:var(--space-2)}
    .mobile-menu.open{display:flex}
    .mobile-menu a{font-size:var(--text-sm);font-weight:600;color:var(--color-text-muted);
      padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);
      transition:color var(--transition-interactive),background var(--transition-interactive)}
    .mobile-menu a:hover{color:var(--color-text);background:rgba(255,255,255,.04)}
    .mobile-menu a.cta-link{background:var(--color-text);color:var(--color-bg);
      text-align:center;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
    @media(max-width:768px){.nav__links,.nav__cta{display:none}.mobile-toggle{display:flex}}
    .hero{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;
      justify-content:center;padding-top:7rem;padding-bottom:var(--space-16)}

    @media(min-width:900px){.hero__layout{grid-template-columns:1fr 340px;align-items:center}}

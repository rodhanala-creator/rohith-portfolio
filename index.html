<form
  id="portfolio-contact-form"
  action="https://api.web3forms.com/submit"
  method="POST"
  class="space-y-5"
>
  <!-- Replace with your real Web3Forms access key -->
  <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY_HERE" />

  <!-- Optional settings -->
  <input type="hidden" name="subject" value="New message from rohithdhanala.com" />
  <input type="hidden" name="from_name" value="Rohith Dhanala Portfolio" />
  <input type="checkbox" name="botcheck" class="hidden" style="display: none;" />

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <input
      type="text"
      id="contact-name"
      name="name"
      placeholder="Your Name"
      required
      class="glass-input-node px-4 py-3.5 text-xs text-white outline-none rounded-xl w-full"
    />
    <input
      type="email"
      id="contact-email"
      name="email"
      placeholder="Your Email"
      required
      class="glass-input-node px-4 py-3.5 text-xs text-white outline-none rounded-xl w-full"
    />
  </div>

  <div>
    <textarea
      id="contact-msg"
      name="message"
      rows="4"
      placeholder="Tell me about the role, project, collaboration, or workflow challenge you want to discuss..."
      required
      class="w-full glass-input-node px-4 py-3.5 text-xs text-white outline-none rounded-xl resize-none"
    ></textarea>
  </div>

  <button
    type="submit"
    class="w-full py-4 bg-white hover:bg-gray-200 text-black text-xs font-bold uppercase tracking-wider transition-all rounded-xl shadow-md"
  >
    Send Message
  </button>
</form>
